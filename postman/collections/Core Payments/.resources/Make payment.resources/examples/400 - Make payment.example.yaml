$kind: http-example
request:
  url: "{{core_payments_url}}/api/v1/billpayments"
  method: POST
  body:
    type: json
    content: >-
      {
      	"validationId": "c79bfab3-6ca3-4f55-9345-dc383266d30d", //payment id from validation step 
      	"account": {
      		"branch": "0001",
      		"number": "123456"
      	},
      	"amount": 101.03,
      	"description": "Some payment description",
      	"scheduledDate": "2026-09-15"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "errors": [
          {
            "code": "INVALID_IDEMPOTENCY_KEY",
            "messages": [
              "Idempotency Key is invalid or is not informed."
            ]
          }
        ]
      }
order: 2000
